
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing application dependencies"
      - npm install

  pre_build:
    commands:
      - echo "Running application tests"
      - npm test

  build:
    commands:
      - echo "Build completed successfully"

  post_build:
    commands:
      - echo "CI build finished"

artifacts:
  files:
    - app.js
    - package.json

